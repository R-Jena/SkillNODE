services:
  - type: web
    name: skillnode-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_APP_URLS
        sync: false
      - key: PUBLIC_APP_URL_REGEX
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOW_DEV_LOGIN_CODE
        value: "false"
