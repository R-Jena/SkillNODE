services:
  - type: web
    name: skillnode-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_APP_URLS
        sync: false
      - key: PUBLIC_APP_URL_REGEX
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOW_DEV_LOGIN_CODE
        value: "false"
